[project]
name = "wdtk"
version = "0.1.0"
description = "Water distribution system modeling toolkit: from-scratch hydraulics validated against EPANET."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipykernel>=6.29",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

# scipy ships without type information; scipy-stubs would be an extra dependency.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wdtk --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
